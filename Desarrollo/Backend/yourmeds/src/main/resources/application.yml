spring:
  application:
    name: yourmeds

  datasource:
    url: jdbc:mysql://localhost:3306/yourmeds_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

